frigate:
  image:
    tag: "0.18.0"
  service:
    type: LoadBalancer
  # -- set environment variables from Secret(s)
  envFromSecrets:
    - frigate-rtsp-credentials
  resources:
    requests:
      cpu: 1
      memory: 8Gi
    limits:
      cpu: 3
      memory: 8Gi
  tmpfs:
    enabled: true
    sizeLimit: 1Gi
  persistence:
    config:
      enabled: true
      size: 10Gi
      storageClass: openebs-storage-persist
      skipuninstall: true
    media:
      enabled: true
      size: 4000Gi
      storageClass: openebs-storage-persist
      skipuninstall: true
  coral:
    enabled: true
  extraInitContainers:
    - name: load-coral-models
      image: ghcr.io/syoder89-homelab/frigate-coral-models:v1.0
      command: ["cp", "-r", "/models/.", "/target-models/"]
      volumeMounts:
        - name: coral-models
          mountPath: /target-models
  extraVolumes:
    - name: dri
      hostPath:
        path: /dev/dri
    - name: coral-models
      emptyDir: {}
  extraVolumeMounts:
    - name: dri
      mountPath: /dev/dri
    - name: coral-models
      mountPath: /models
      readOnly: true
  # Frigate's config is intentionally not supplied here. It lives at /config/config.yml on the
  # frigate-config PVC and is edited in the Frigate UI (Settings). Credentials stay as
  # {FRIGATE_RTSP_USERNAME}/{FRIGATE_RTSP_PASSWORD} placeholders, supplied via envFromSecrets.
