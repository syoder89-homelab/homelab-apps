---
# Source: frigate/templates/frigate-image-prepull.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: test-frigate-image-prepull
  namespace: test-frigate
  labels:
    app.kubernetes.io/name: frigate-image-prepull
    app.kubernetes.io/instance: test-frigate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frigate-image-prepull
        app.kubernetes.io/instance: test-frigate
    spec:
      restartPolicy: Never
      # Prefer the node already running Frigate so the image is cached where the
      # replacement pod will start. Preferred (not required) so a first install,
      # with no Frigate pod yet, does not leave this hook Pending.
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: frigate
                    app.kubernetes.io/instance: test-frigate
      containers:
        - name: prepull
          image: "ghcr.io/blakeblackshear/frigate:0.12.0"
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exit 0"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
